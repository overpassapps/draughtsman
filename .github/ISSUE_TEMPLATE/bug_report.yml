name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Do not report security vulnerabilities here**: see [SECURITY.md](https://github.com/overpassapps/draughtsman/blob/main/SECURITY.md).
        Please do not attach a diagram that contains confidential information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows it. A short DSL snippet that reproduces it is ideal.
      placeholder: |
        1. Create a flowchart
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Draughtsman version
      description: "`draughtsman --version`, or About in the app."
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Docker
        - Release archive
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage
      options:
        - SQLite (default)
        - Postgres
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and browser
      placeholder: macOS 15, Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: "`draughtsman doctor` output is useful. Remove tokens, passwords and anything private first."
      render: shell
